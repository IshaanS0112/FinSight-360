version: 2

# Two policies applied to every ecosystem below:
#
#   groups  - minor and patch bumps arrive as one PR per ecosystem rather than
#             one per package. Without this, a routine month produces four or
#             five separate PRs for sqlalchemy, pydantic-settings, python-dotenv
#             and psycopg2, none of which warrants individual review.
#
#   ignore  - major bumps are excluded. Dependabot cannot know that
#             tailwindcss 3->4 is a config-format rewrite, that
#             react-router-dom 6->7 changes the routing API, or that vite 6->8
#             moves the build toolchain underneath the app. Each arrived as its
#             own unmergeable PR. Majors are done deliberately, by hand.

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-packages:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-packages:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

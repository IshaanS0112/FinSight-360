name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Test
        working-directory: backend
        # No services block: the models declare JSONB and UUID as dialect
        # variants, so the API tests run the real app against SQLite. CI needs
        # no database container.
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  sample-data:
    name: Sample filings are valid and reproduce the documented verdicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Validate every sample filing against its expected zone
        working-directory: backend
        # The validation tests read the JSON files directly, so a filing edited
        # to a value that no longer produces the documented verdict fails here.
        run: python -m pytest tests/test_altman_zscore.py -q
